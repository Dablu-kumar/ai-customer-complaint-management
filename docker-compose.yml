version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aivoa_postgres
    restart: always
    environment:
      POSTGRES_USER: aivoa_user
      POSTGRES_PASSWORD: aivoa_secure_password_2026
      POSTGRES_DB: aivoa_qms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa_user -d aivoa_qms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivoa_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aivoa_user:aivoa_secure_password_2026@db:5432/aivoa_qms
      SECRET_KEY: aivoa-production-jwt-key-21cfrpart11-certified
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivoa_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  uploads_data:
